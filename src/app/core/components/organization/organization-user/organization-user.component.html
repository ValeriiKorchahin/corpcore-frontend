<mat-card class="card">
  <div class="card__header">
    <mat-form-field appearance="outline">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" placeholder="Search by name" (input)="setFilter($event)"/>
    </mat-form-field>
  </div>
  <div class="card__table-container table-container">
    <table mat-table [dataSource]="orgUserStore.users()">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let element">
          @if (element.role !== OrganizationRoleEnum.MANAGER) {
              <mat-form-field appearance="outline" class="role-select">
                <mat-select [value]="element.role" (selectionChange)="changeUserRole($event, element)">
                  <mat-option [value]="OrganizationRoleEnum.USER">
                    User
                  </mat-option>
                  <mat-option [value]="OrganizationRoleEnum.ADMIN">
                    Admin
                  </mat-option>
                </mat-select>
              </mat-form-field>
          } @else {
            Manager
          }
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button [matMenuTriggerFor]="actionsMenu" matTooltip="Actions">
            <mat-icon> more_vert</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
    <mat-paginator (page)="setPagination($event)"
                   [length]="orgUserStore.total()"
                   [pageSizeOptions]="[25, 50, 100]">
    </mat-paginator>
  </div>
</mat-card>

<mat-menu #actionsMenu>
  <button mat-menu-item>
    <mat-icon> delete</mat-icon>
    Delete
  </button>
</mat-menu>
