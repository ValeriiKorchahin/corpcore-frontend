<mat-card class="card">
  <div class="card__header flex-row-10">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" placeholder="Search by name" (input)="setFilter($event)"/>
    </mat-form-field>
    <button matButton="elevated" class="btn-add" (click)="openCompany()">
      <mat-icon>add</mat-icon>
      Add Company
    </button>
  </div>
  <div class="card__table-container table-container">
    @if (orgCompaniesStore.isLoading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <table mat-table [dataSource]="orgCompaniesStore.companies()">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>

      <!-- Country Column -->
      <ng-container matColumnDef="country">
        <th mat-header-cell *matHeaderCellDef>Country</th>
        <td mat-cell *matCellDef="let element">{{ element.country }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button
                  [matMenuTriggerData]="{company: element}"
                  [matMenuTriggerFor]="actionsMenu"
                  matTooltip="Actions">
            <mat-icon> more_vert</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
    <mat-paginator (page)="setPagination($event)"
                   [length]="orgCompaniesStore.total()"
                   [pageSizeOptions]="[20, 50, 100]">
    </mat-paginator>
  </div>
</mat-card>

<mat-menu #actionsMenu>
  <ng-template matMenuContent let-company="company">
    <button mat-menu-item>
      <mat-icon> person_add</mat-icon>
      Add user
    </button>
    <button mat-menu-item (click)="openCompany(company)">
      <mat-icon> edit</mat-icon>
      Edit/View
    </button>
    <button mat-menu-item>
      <mat-icon> delete</mat-icon>
      Delete
    </button>
  </ng-template>
</mat-menu>
